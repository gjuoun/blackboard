name: Feature request
description: An idea or a workflow Blackboard does not cover yet
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The workflow or friction, in one or two sentences. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would like to see — a command, a UI affordance, a setting. A sketch or a mock is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workarounds you tried, and why they fall short.
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Only if the request is platform-specific.
      placeholder: "e.g. macOS 15.2 arm64"
    validations:
      required: false
