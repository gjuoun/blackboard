# Deploys the landing site to Cloudflare Pages on push to main or manual trigger.
name: site

on:
  push:
    branches: [main]
    paths: ["apps/blackboard-site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-blackboard-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run --cwd apps/blackboard-site build

      - name: Check asset prefixes
        run: ./scripts/check-asset-prefixes.sh apps/blackboard-site/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/blackboard-site/dist --project-name blackboard --branch main
