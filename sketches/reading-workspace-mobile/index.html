<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>移动端阅读工作区 · 方案 A · 列表/预览/设置</title>
<style>
@font-face { font-family: "QB Sans Latin"; src: local("QuBlackSansVF-Regular"), local("QuBlackSans-Regular"); font-weight: 100 900; unicode-range: U+0000-024F, U+2000-206F, U+20A0-20BF, U+2190-21FF, U+2500-257F; }
@font-face { font-family: "QB Sans CJK"; src: local("QuBlackSansVF-Regular"), local("QuBlackSans-Regular"); font-weight: 100 900; unicode-range: U+2E80-2EFF, U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF; }
@font-face { font-family: "QB Mono Latin"; src: local("QuBlackMono-Regular"); unicode-range: U+0000-024F, U+2000-206F, U+20A0-20BF, U+2190-21FF, U+2500-257F; }
@font-face { font-family: "QB Mono CJK"; src: local("QuBlackMono-Regular"); unicode-range: U+2E80-2EFF, U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF; }

/* Tokens mirror app/themes.css (paper is the default); 1/2/3 in the band swap palettes. */
[data-theme="paper"] {
  color-scheme: light;
  --background: #faf8f5; --foreground: #2b2622; --card: #ffffff;
  --primary: #b3532f; --primary-foreground: #ffffff;
  --secondary: #f1ebe4; --muted: #f1ebe4; --muted-foreground: #6f675e;
  --accent: #efe9e2; --border: #ebe5de; --input: #ebe5de;
  --primary-soft: #f8e6df; --success: #2f7d4f; --warn: #9a6700;
}
[data-theme="plain"] {
  color-scheme: light;
  --background: #ffffff; --foreground: #18181b; --card: #ffffff;
  --primary: #1f6feb; --primary-foreground: #ffffff;
  --secondary: #f4f4f5; --muted: #f4f4f5; --muted-foreground: #5f6368;
  --accent: #f4f4f5; --border: #e5e7eb; --input: #e5e7eb;
  --primary-soft: #e8f0fe; --success: #1a7f37; --warn: #8a5a00;
}
[data-theme="night"] {
  color-scheme: dark;
  --background: #0f1115; --foreground: #e6e6e6; --card: #151920;
  --primary: #7aa2f7; --primary-foreground: #0b0e13;
  --secondary: #1b2028; --muted: #1b2028; --muted-foreground: #9aa0a6;
  --accent: #1f2530; --border: #262a31; --input: #262a31;
  --primary-soft: #16233a; --success: #3fb950; --warn: #d29922;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font-family: "QB Sans Latin", "QB Sans CJK", "PingFang SC", sans-serif;
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
.mono { font-family: "QB Mono Latin", "QB Mono CJK", monospace; font-variant-ligatures: none; }

/* ---- annotation band (same anatomy as the v1-inbox sketch) ---- */
.band {
  flex: none; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px;
  background: var(--secondary); border-bottom: 1px solid var(--border);
  font-size: 12px; color: var(--muted-foreground);
}
.band b { color: var(--foreground); font-weight: 600; }
.band .tag { white-space: nowrap; font-family: "QB Mono Latin", monospace; font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 1px 7px; color: var(--foreground); }
.band .note { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.band nav { margin-left: auto; flex: none; display: flex; gap: 2px; align-items: center; white-space: nowrap; }
.band nav a { padding: 2px 8px; border-radius: 6px; }
.band nav a:hover { background: var(--card); color: var(--foreground); }
.band nav a[aria-current="page"] { background: var(--card); border: 1px solid var(--border); color: var(--foreground); font-weight: 600; }
.theme-picks { display: flex; gap: 3px; padding-left: 8px; border-left: 1px solid var(--border); }
.theme-picks button { width: 18px; height: 18px; border-radius: 999px; border: 1px solid var(--border); font-size: 9px; line-height: 1; color: var(--muted-foreground); }
.theme-picks button[aria-pressed="true"] { border-color: var(--primary); color: var(--primary); font-weight: 700; }

/* ---- stage: two phone frames per variant, 390 × 780 ---- */
.stage {
  flex: 1; min-height: 0; overflow: auto; display: flex; align-items: flex-start; justify-content: center;
  gap: 30px; padding: 16px 20px 24px;
  background: color-mix(in srgb, var(--secondary) 55%, var(--background));
}
.variant { display: flex; gap: 30px; align-items: flex-start; }
.device { display: flex; flex-direction: column; gap: 7px; }
.cap { display: flex; align-items: baseline; gap: 8px; padding-left: 6px; font-size: 11.5px; color: var(--muted-foreground); }
.cap b { color: var(--foreground); font-size: 12px; font-weight: 600; }
.cap .cap-tag { font-family: "QB Mono Latin", monospace; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; opacity: .8; }
.phone {
  position: relative; width: 390px; height: 780px; border-radius: 34px;
  border: 1px solid var(--border); background: var(--background);
  box-shadow: 0 26px 60px -42px rgba(0,0,0,.6); overflow: hidden;
  display: flex; flex-direction: column;
}
.statusbar { flex: none; height: 26px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-family: "QB Mono Latin", monospace; font-size: 10.5px; color: var(--muted-foreground); }
.screen { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--background); }

/* ---- shared mobile chrome ---- */
.mbar { flex: none; height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 14px; border-bottom: 1px solid var(--border); background: var(--background); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
.brand-mark { width: 10px; height: 10px; background: var(--primary); border-radius: 2px; transform: rotate(45deg); }
.spacer { flex: 1; }
.count-line { font-family: "QB Mono Latin", "QB Mono CJK", monospace; font-size: 10.5px; color: var(--muted-foreground); white-space: nowrap; }
.btn { height: 30px; padding: 0 11px; border: 1px solid var(--border); background: var(--card); border-radius: 8px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--accent); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.btn.ghost { border-color: transparent; color: var(--muted-foreground); }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; color: var(--muted-foreground); font-size: 16px; line-height: 1; }
.icon-btn:hover { background: var(--accent); color: var(--foreground); }
.icon-btn[data-disabled="true"] { opacity: .35; pointer-events: none; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 10px; }

/* ---- rows: v1 anatomy, no checkbox column (batch select is desktop-only) ---- */
.list { padding: 2px 0 16px; }
.row {
  position: relative; display: grid; grid-template-columns: 9px minmax(0, 1fr) auto;
  align-items: center; gap: 10px; padding: 11px 14px;
}
.row + .row { box-shadow: inset 0 1px 0 var(--border); }
.row:hover { background: var(--card); box-shadow: none; }
.row[data-selected="true"] { background: var(--primary-soft); box-shadow: none; }
.row .state { width: 9px; height: 9px; border-radius: 999px; }
.row[data-state="unread"] .state { background: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.row[data-state="reading"] .state { background: transparent; box-shadow: inset 0 0 0 1.5px var(--primary); }
.row[data-state="unread"] .title { font-weight: 700; }
.title-line { display: flex; align-items: center; gap: 6px; min-width: 0; }
.title { font-size: 14px; font-weight: 500; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmt { flex: none; font-family: "QB Mono Latin", monospace; font-size: 10px; color: var(--primary); background: var(--primary-soft); border-radius: 999px; padding: 0 5px; line-height: 16px; }
.sub { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 7px; margin-top: 3px; font-family: "QB Mono Latin", "QB Mono CJK", monospace; font-size: 10.5px; color: var(--muted-foreground); min-width: 0; }
.sub .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.sub .branch { opacity: .75; white-space: nowrap; }
.meta { font-size: 10.5px; color: var(--muted-foreground); text-align: right; line-height: 1.45; min-width: 62px; }
.meta b { display: block; font-weight: 500; color: var(--foreground); font-size: 10.5px; }
.hint { margin: 12px 16px 0; font-size: 11px; line-height: 1.65; color: var(--muted-foreground); }
.hint code { font-family: "QB Mono Latin", monospace; background: var(--muted); border-radius: 4px; padding: 0 4px; }

/* ---- A: bottom tab bar, 5 items (设置 is the global entry) ---- */
.tabbar { flex: none; height: 56px; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--border); background: var(--card); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 9.5px; letter-spacing: .01em; color: var(--muted-foreground); }
.tab svg { width: 19px; height: 19px; }
.tab[aria-current="true"] { color: var(--primary); font-weight: 600; }
.tab:active { background: var(--accent); }

/* ---- A: detail bar + ⋯ menu ---- */
.dt-title { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.dt-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 600; }
.badge { font-family: "QB Mono Latin", "QB Mono CJK", monospace; font-size: 9.5px; letter-spacing: .03em; border-radius: 999px; padding: 1px 7px; background: var(--muted); color: var(--muted-foreground); }
.badge[data-s="unread"] { background: var(--primary-soft); color: var(--primary); }
.badge[data-s="reading"] { background: transparent; box-shadow: inset 0 0 0 1px var(--primary); color: var(--primary); }
.back { font-size: 22px; font-weight: 400; padding-bottom: 3px; }
.menu {
  position: absolute; top: 46px; right: 10px; z-index: 20; width: 168px; padding: 5px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--card);
  box-shadow: 0 20px 44px -30px rgba(0,0,0,.65);
}
.menu button { display: block; width: 100%; text-align: left; padding: 9px 10px; border-radius: 7px; font-size: 12.5px; }
.menu button:hover { background: var(--accent); }

/* ---- preview body: an opened email thread ---- */
.pv-wrap { padding: 0 16px 20px; }
.pv-title { margin: 14px 0 0; font-size: 18px; line-height: 1.42; font-weight: 700; letter-spacing: -0.01em; }
.pv-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 6px; margin: 8px 0 0; padding-bottom: 12px; border-bottom: 1px solid var(--border); font-family: "QB Mono Latin", "QB Mono CJK", monospace; font-size: 10px; color: var(--muted-foreground); }
.pv-meta .sep { opacity: .45; }
.pv-meta .path { overflow-wrap: anywhere; }
.pv-thread { padding-top: 13px; font-size: 13.5px; line-height: 1.82; color: color-mix(in srgb, var(--foreground) 88%, var(--muted-foreground)); }
.pv-thread p { margin: 0 0 11px; }
.thread-sep { display: flex; align-items: center; gap: 8px; margin: 18px 0 10px; font-family: "QB Mono Latin", "QB Mono CJK", monospace; font-size: 10px; color: var(--muted-foreground); }
.thread-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.reply-list { display: flex; flex-direction: column; gap: 8px; }
.reply-item { border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 8px 10px; }
.reply-head { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted-foreground); }
.reply-head b { font-size: 11.5px; font-weight: 600; color: var(--foreground); }
.reply-item p { margin: 2px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--foreground); white-space: pre-wrap; word-break: break-word; }

/* ---- A: reply affordance at the end of the body (Apple Mail reads like this) ---- */
.reply-line {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 44px; margin-top: 16px;
  padding: 0 2px; border-top: 1px solid var(--border); color: var(--primary); font-size: 13.5px;
}
.reply-line svg { width: 16px; height: 16px; }
.reply-line .reply-note { margin-left: auto; font-size: 10.5px; color: var(--muted-foreground); }

/* ---- tap-to-open composer: Gmail-style, docked at the bottom of the thread ---- */
.replybar { flex: none; border-top: 1px solid var(--border); background: var(--card); padding: 8px 10px calc(18px + env(safe-area-inset-bottom)); }
.replybar-row { display: flex; align-items: center; gap: 8px; }
.replybar-open { flex: 1; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 13px; border: 1px solid var(--border); border-radius: 999px; background: var(--background); color: var(--muted-foreground); font: inherit; font-size: 12.5px; text-align: left; cursor: pointer; }
.replybar-open svg { width: 15px; height: 15px; flex: none; opacity: .75; }
.replybar-send { flex: none; width: 36px; height: 36px; border-radius: 999px; border: 0; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; cursor: pointer; }
.replybar-send svg { width: 16px; height: 16px; }
.replybar.is-open .replybar-row { display: none; }
.replybar .composer { margin: 0; border: 0; background: transparent; box-shadow: none; padding: 2px 2px 0; }
.replybar .composer textarea { min-height: 54px; }
.menu button { display: flex; align-items: center; gap: 10px; }
.menu button .mk { margin-left: auto; font-size: 11px; color: var(--muted-foreground); }
.composer { margin-top: 16px; border: 1px solid var(--primary); border-radius: 10px; background: var(--card); padding: 9px 10px 8px; box-shadow: 0 0 0 3px var(--primary-soft); }
.composer textarea { display: block; width: 100%; min-height: 62px; resize: none; border: 0; background: transparent; color: var(--foreground); font: inherit; font-size: 13px; line-height: 1.6; outline: 0; }
.composer textarea::placeholder { color: var(--muted-foreground); }
.composer-foot { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.composer-foot .composer-note { flex: 1; font-size: 10px; color: var(--muted-foreground); }
.composer-foot .btn { height: 28px; font-size: 12px; }

/* ---- settings screen: grouped rows in iOS-style cards, current value on the right ---- */
.sg { padding: 13px 12px 0; }
.sg-label { margin: 0 4px 6px; font-family: "QB Mono Latin", "QB Mono CJK", monospace; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); }
.sg-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.sg-row { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; font-size: 13px; text-align: left; }
.sg-row + .sg-row { box-shadow: inset 0 1px 0 var(--border); }
.sg-row:active { background: var(--accent); }
.sg-key { font-weight: 500; }
.sg-val { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; }
.sg-chev { font-size: 14px; opacity: .5; }

/* ---- empty preview ---- */
.empty { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 7px; padding: 26px 24px; color: var(--muted-foreground); }
.pe-mark { width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 9px; display: grid; place-items: center; font-size: 15px; background: var(--card); color: var(--muted-foreground); margin-bottom: 4px; }
.empty p { margin: 0; font-size: 14px; font-weight: 600; color: var(--foreground); }
.empty .pe-sub { font-size: 12.5px; line-height: 1.65; max-width: 250px; }

/* ---- A: new-workspace compose screen (from the tab bar ＋) ---- */
.compose-card { flex: 1; min-height: 0; display: flex; flex-direction: column; margin: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--background); box-shadow: 0 18px 40px -34px rgba(0,0,0,.6); overflow: hidden; }
.cf-head { flex: none; display: flex; align-items: center; gap: 7px; padding: 11px 13px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; }
.cf-head .cf-sub { font-weight: 400; font-size: 10.5px; color: var(--muted-foreground); }
.cf-body { flex: 1; min-height: 0; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 11px; }
.cf-field { display: flex; flex-direction: column; gap: 5px; }
.cf-field > span { font-size: 10.5px; color: var(--muted-foreground); }
.cf-field input, .cf-field textarea { width: 100%; border: 1px solid var(--input); border-radius: 8px; background: var(--card); color: var(--foreground); font: inherit; font-size: 12.5px; padding: 8px 10px; outline: 0; }
.cf-field input { height: 34px; }
.cf-field textarea { min-height: 120px; resize: none; line-height: 1.6; }
.cf-field input:focus, .cf-field textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.cf-field input::placeholder, .cf-field textarea::placeholder { color: var(--muted-foreground); }
.cf-err { margin: 0; font-size: 11px; color: var(--primary); }
.cf-foot { flex: none; display: flex; justify-content: flex-end; gap: 8px; padding: 11px 12px; border-top: 1px solid var(--border); background: var(--card); }
.cf-foot .btn { height: 32px; }
</style>
</head>
<body>

<div class="band">
  <span class="tag">mobile · 方向已定 A</span>
  <b>移动端阅读工作区</b>
  <span class="note">邮件式导航 · 仅点按 · 底部常驻回复栏（点开就地展开）· 设置是全局第 5 个 tab</span>
  <nav>
    <a href="?v=a" aria-current="page">A 邮件导航</a>
    <span class="theme-picks" aria-label="配色">
      <button data-theme-pick="paper" aria-pressed="true" title="Paper (1)">1</button>
      <button data-theme-pick="plain" aria-pressed="false" title="Plain (2)">2</button>
      <button data-theme-pick="night" aria-pressed="false" title="Night (3)">3</button>
    </span>
  </nav>
</div>

<main class="stage">
  <!-- ===================== Variant A — mail-app navigation ===================== -->
  <section class="variant" data-variant-panel="a">
    <div class="device">
      <div class="cap"><b>列表</b><span class="cap-tag">A</span><span>底部 tab 栏 · 56px</span></div>
      <div class="phone">
        <div class="statusbar"><span>9:41</span><span>5G ▮</span></div>
        <div class="screen">
          <header class="mbar">
            <span class="brand"><span class="brand-mark"></span>收件箱</span>
            <span class="spacer"></span>
            <span class="count-line" data-count-a>4 未读 · 3 在读</span>
            <button class="icon-btn" title="搜索" aria-label="搜索">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </button>
          </header>

          <div class="scroll" id="a-scroll">
            <div class="list" id="list-a"></div>
            <p class="hint">按最后更新时间倒序：未读加粗带实心点，点开即读；在读只留一个空心圈，不显示百分比。<code>blackboard comment</code> 留的评论不改变状态。</p>
          </div>
          <div class="scroll" id="a-settings" hidden></div>

          <div class="compose-card" id="a-compose" hidden>
            <div class="cf-head">
              <span>＋ 新工作区</span>
              <span class="cf-sub">让 agent 在一个目录里干活</span>
            </div>
            <div class="cf-body">
              <label class="cf-field"><span>工作区路径</span>
                <input id="cf-path" type="text" placeholder="research/new-topic/" autocomplete="off" spellcheck="false" />
              </label>
              <label class="cf-field"><span>标题</span>
                <input id="cf-title" type="text" placeholder="这次要读 / 写什么…" autocomplete="off" />
              </label>
              <label class="cf-field"><span>任务说明</span>
                <textarea id="cf-desc" placeholder="让 agent 在这个目录里做什么…"></textarea>
              </label>
              <p class="cf-err" id="cf-err" hidden></p>
            </div>
            <div class="cf-foot">
              <button class="btn ghost" data-act="cf-cancel">取消</button>
              <button class="btn primary" data-act="cf-create">创建</button>
            </div>
          </div>

          <nav class="tabbar" id="tabbar-a"></nav>
        </div>
      </div>
    </div>

    <div class="device">
      <div class="cap"><b>预览</b><span class="cap-tag">A</span><span>‹ 返回 · 底部常驻回复栏 · ⋯ 菜单</span></div>
      <div class="phone">
        <div class="statusbar"><span>9:41</span><span>5G ▮</span></div>
        <div class="screen">
          <header class="mbar">
            <button class="icon-btn back" data-act="a-back" aria-label="返回列表" title="返回列表">‹</button>
            <div class="dt-title">
              <span class="dt-name" id="a-title"></span>
              <span class="badge" id="a-badge" hidden></span>
            </div>
            <button class="icon-btn" id="a-more" data-act="a-menu" aria-label="更多" title="更多">⋯</button>
          </header>
          <div class="menu" id="a-menu" hidden>
            <button data-act="a-mark-unread"><span>标记未读</span><span class="mk">●</span></button>
            <button data-act="a-open"><span>打开全文</span><span class="mk">↗</span></button>
            <button data-act="a-copy"><span>复制链接</span><span class="mk">⧉</span></button>

    state.tab = key;
    const isList = ["all", "unread", "reading"].includes(key);
    if (isList) state.filter = key;
    $("a-scroll").hidden = !isList;
    $("a-compose").hidden = key !== "new";
    $("a-settings").hidden = key !== "settings";
    if (key === "settings") $("a-settings").innerHTML = settingsHtml();
    document.querySelectorAll("#tabbar-a [data-tab]").forEach((t) =>
      t.setAttribute("aria-current", String(t.dataset.tab === key)));
    $("cf-err").hidden = true;
    renderLists();
    if (key === "new") $("cf-path").focus();
  };

  let wsSeq = 0;
  const createWorkspace = () => {
    const path = $("cf-path").value.trim();
    const title = $("cf-title").value.trim();
    const desc = $("cf-desc").value.trim();
    if (!path || !title) {
      $("cf-err").hidden = false;
      $("cf-err").textContent = !path ? "工作区路径必填" : "标题必填";
      (!path ? $("cf-path") : $("cf-title")).focus();
      return;
    }
    const doc = {
      id: `ws-${++wsSeq}`, title, path, branch: "", state: "unread", cmts: 0,
      metaTop: "刚刚", metaSub: "新建", words: "—", updated: "刚刚",
      paras: [desc || "还没有任务说明。"], replies: [],
    };
    DOCS.unshift(doc);
    $("cf-path").value = "";
    $("cf-title").value = "";
    $("cf-desc").value = "";
    setTab("all");
    select(doc.id);
    $("a-scroll").scrollTop = 0;
  };

  /* ---- taps, dispatched from one place (no drag / touch handlers anywhere) ---- */
  document.addEventListener("click", (e) => {
    const row = e.target.closest(".row");
    const act = e.target.closest("[data-act]");
    const tab = e.target.closest("[data-tab]");

    if (tab) {
      setTab(tab.dataset.tab);
      return;
    }

    if (row) { select(row.dataset.id); return; }

    if (act) {
      const a = act.dataset.act;
      const d = byId(state.sel);
      if (a === "a-back") { state.sel = null; state.menuOpen = false; state.composer = false; render(); return; }
      if (a === "a-menu") { state.menuOpen = !state.menuOpen; $("a-menu").hidden = !state.menuOpen; return; }
      if (a === "a-mark-unread") { if (d) setUnread(d); state.menuOpen = false; $("a-menu").hidden = true; return; }
      if (a === "a-copy") { state.menuOpen = false; $("a-menu").hidden = true; flash($("a-body")); return; }
      if (a === "a-open") { state.menuOpen = false; $("a-menu").hidden = true; flash($("a-body")); return; }
      if (a === "a-reply") { openComposer(); return; }
      if (a === "a-cancel") { state.composer = false; render(); return; }
      if (a === "a-send") { send(); return; }
      if (a === "cf-cancel") { setTab(state.filter); return; }
      if (a === "cf-create") { createWorkspace(); return; }
      return;
    }

    if (state.menuOpen && !e.target.closest("#a-menu")) { state.menuOpen = false; $("a-menu").hidden = true; }
  });

  document.addEventListener("input", (e) => {
    if ("draft" in e.target.dataset) state.draft = e.target.value;
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (state.composer) { state.composer = false; render(); return; }
      if (state.menuOpen) { state.menuOpen = false; $("a-menu").hidden = true; }
    }
    if (e.target.matches("textarea, input")) return;
    if (["1", "2", "3"].includes(e.key)) setTheme(["paper", "plain", "night"][Number(e.key) - 1]);
  });

  $("tabbar-a").innerHTML = tabbarHtml("all", true);
  $("tabbar-settings").innerHTML = tabbarHtml("settings", false);
  $("settings-body").innerHTML = settingsHtml();
  const t = new URLSearchParams(location.search).get("theme");
  if (["paper", "plain", "night"].includes(t)) setTheme(t);
  render();
})();
</script>
</body>
</html>
